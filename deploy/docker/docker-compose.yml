services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-4000}:4000"
    volumes:
      - photo_booth_bot_data:/app/data
      - photo_booth_bot_storage:/app/storage

volumes:
  photo_booth_bot_data:
  photo_booth_bot_storage:
