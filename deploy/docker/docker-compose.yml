services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-4000}:4000"
    volumes:
      - bot_machine_data:/app/data
      - bot_machine_storage:/app/storage

volumes:
  bot_machine_data:
  bot_machine_storage:
